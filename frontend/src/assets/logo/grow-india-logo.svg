<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" className="grow-logo">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7413" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
  </defs>
  <!-- Emblem Symbol -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="2" />
    <path d="M18 42 L30 18 L42 42" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 35 L38 35" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" />
    <circle cx="30" cy="18" r="3" fill="#E2B755" />
    <path d="M30 26 L30 46" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.6" />
    <circle cx="30" cy="46" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(82, 22)">
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="0.12em" fill="#0A1128">GROW</text>
    <text x="106" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" letter-spacing="0.16em" fill="#C59B27">INDIA</text>
    <text x="1" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.18em" fill="#64748B">GOVIND RAADHAA ORGANIZATIONAL WONDERS</text>
  </g>
</svg>
